name: Build (unsigned)

# Secret-free release build for forks: no code signing, no updater
# artifacts, no R2 upload. Runs when a v* tag is pushed from master and
# attaches the installers to a draft GitHub Release for that tag.
on:
  push:
    tags: ['v*']

jobs:
  verify-master:
    name: tag is on master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag commit is reachable from master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  build:
    needs: verify-master
    name: build (${{ matrix.artifact_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact_name: macos-arm64
            artifact_path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact_name: windows-x64
            artifact_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact_name: linux-x64
            artifact_path: |
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Setup built-in extensions
        shell: bash
        run: bash scripts/setup-extensions.sh

      # beforeBuildCommand runs `bun run build`; the release config is
      # left out so no updater signing key is required.
      - name: Build Tauri app
        run: bunx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sidex-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SideX ${{ github.ref_name }} (unsigned)
          draft: true
          generate_release_notes: true
          files: installers/**
